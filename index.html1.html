
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediaHub - My Media</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101827;
    color: white;
}

header {
    background: #17243a;
    padding: 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    color: #38bdf8;
}

.login {
    background: #2563eb;
    border: none;
    color: white;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
}

nav {
    background: #202f46;
    padding: 12px;
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
}

nav a {
    color: white;
    text-decoration: none;
}

nav a:hover {
    color: #38bdf8;
}

.container {
    padding: 22px;
}

h2 {
    color: #38bdf8;
}

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 20px;
}

button, .upload-label {
    background: #2563eb;
    color: white;
    border: none;
    padding: 11px 15px;
    border-radius: 7px;
    cursor: pointer;
}

input {
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #52627a;
    background: #17243a;
    color: white;
}

.folder-list {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin: 15px 0;
}

.folder {
    background: #26364e;
    padding: 15px;
    border-radius: 8px;
    cursor: pointer;
}

.folder.active {
    outline: 2px solid #38bdf8;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 18px;
}

.card {
    background: #202f46;
    border-radius: 10px;
    padding: 12px;
    overflow: hidden;
}

.card img, .card video {
    width: 100%;
    height: 150px;
    object-fit: cover;
    border-radius: 7px;
    background: #080d17;
}

.card p {
    overflow-wrap: anywhere;
}

.card button {
    margin: 4px 2px;
    padding: 8px 10px;
}

.page {
    display: none;
}

.page.active {
    display: block;
}

#loginBox {
    display: none;
    position: fixed;
    inset: 0;
    background: #000b;
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.login-panel {
    background: #202f46;
    padding: 25px;
    border-radius: 12px;
    width: 100%;
    max-width: 340px;
}

.login-panel input {
    width: 100%;
    margin: 8px 0;
}

footer {
    text-align: center;
    padding: 25px;
    color: #aab8ca;
}
</style>
</head>

<body>

<header>
    <div class="logo">📁 MediaHub</div>
    <button class="login" onclick="openLogin()">👤 Login</button>
</header>

<nav>
    <a href="#" onclick="showPage('home')">Home</a>
    <a href="#" onclick="showPage('images')">Images</a>
    <a href="#" onclick="showPage('videos')">Videos</a>
    <a href="#" onclick="showPage('folders')">Folders</a>
    <a href="#" onclick="showPage('about')">About</a>
</nav>

<div class="container">

<section id="home" class="page active">
    <h2>Welcome to MediaHub</h2>
    <p>Upload, organize, rename and manage your images and videos.</p>

    <div class="actions">
        <label class="upload-label">
            📤 Upload Media
            <input type="file" id="fileInput"
            accept="image/*,video/*" multiple hidden
            onchange="uploadFiles(this.files)">
        </label>

        <input type="text" id="folderName"
        placeholder="New folder name">

        <button onclick="createFolder()">+ Create Folder</button>
    </div>

    <h2>My Folders</h2>
    <div id="folderList" class="folder-list"></div>

    <h2>My Media</h2>
    <div id="mediaGallery" class="gallery"></div>
</section>

<section id="images" class="page">
    <h2>My Images</h2>
    <div id="imageGallery" class="gallery"></div>
</section>

<section id="videos" class="page">
    <h2>My Videos</h2>
    <div id="videoGallery" class="gallery"></div>
</section>

<section id="folders" class="page">
    <h2>My Folders</h2>
    <div id="folderPageList" class="folder-list"></div>
</section>

<section id="about" class="page">
    <h2>About MediaHub</h2>
    <p>MediaHub is a personal media organizer for images and videos.</p>
</section>

</div>

<div id="loginBox">
    <div class="login-panel">
        <h2>👤 Account</h2>
        <input id="username" placeholder="Username">
        <input id="password" type="password"
        placeholder="Password">

        <button onclick="login()">Login</button>
        <button onclick="register()">Register</button>
        <button onclick="logout()">Logout</button>
        <button onclick="closeLogin()">Close</button>

        <p id="loginMessage"></p>
    </div>
</div>

<footer>© 2026 MediaHub</footer>

<script>
let media = [];
let folders = ["My Files"];
let selectedFolder = "My Files";
let currentUser = null;

function showPage(page) {
    document.querySelectorAll(".page").forEach(p => {
        p.classList.remove("active");
    });

    document.getElementById(page).classList.add("active");
    render();
}

function openLogin() {
    document.getElementById("loginBox").style.display = "flex";
}

function closeLogin() {
    document.getElementById("loginBox").style.display = "none";
}

function register() {
    let username = document.getElementById("username").value.trim();
    let password = document.getElementById("password").value;

    if (!username || !password) {
        alert("Enter username and password");
        return;
    }

    if (localStorage.getItem("user_" + username)) {
        alert("Username already exists");
        return;
    }

    localStorage.setItem("user_" + username, password);
    alert("Account created! You can now log in.");
}

function login() {
    let username = document.getElementById("username").value.trim();
    let password = document.getElementById("password").value;

    if (localStorage.getItem("user_" + username) === password) {
        currentUser = username;
        document.getElementById("loginMessage").textContent =
            "Welcome " + username;
        closeLogin();
        alert("Login successful");
    } else {
        alert("Incorrect username or password");
    }
}

function logout() {
    currentUser = null;
    alert("Logged out");
    closeLogin();
}

function createFolder() {
    let name = document.getElementById("folderName").value.trim();

    if (!name) {
        alert("Enter folder name");
        return;
    }

    if (folders.includes(name)) {
        alert("Folder already exists");
        return;
    }

    folders.push(name);
    document.getElementById("folderName").value = "";
    render();
}

function uploadFiles(files) {
    if (!files.length) return;

    for (const file of files) {
        if (!file.type.startsWith("image/") &&
            !file.type.startsWith("video/")) {
            continue;
        }

        const reader = new FileReader();

        reader.onload = function(e) {
            media.push({
                id: Date.now() + Math.random(),
                name: file.name,
                type: file.type,
                data: e.target.result,
                folder: selectedFolder
            });

            saveData();
            render();
        };

        reader.readAsDataURL(file);
    }
}

function renameMedia(id) {
    const item = media.find(m => m.id === id);
    if (!item) return;

    let newName = prompt("Enter new file name:", item.name);

    if (newName && newName.trim()) {
        item.name = newName.trim();
        saveData();
        render();
    }
}

function deleteMedia(id) {
    if (!confirm("Delete this file?")) return;

    media = media.filter(m => m.id !== id);
    saveData();
    render();
}

function selectFolder(name) {
    selectedFolder = name;
    render();
    showPage("home");
}

function moveMedia(id) {
    const item = media.find(m => m.id === id);
    if (!item) return;

    let name = prompt("Move to folder:\n" + folders.join(", "));
    if (folders.includes(name)) {
        item.folder = name;
        saveData();
        render();
    } else if (name) {
        alert("Folder not found");
    }
}

function saveData() {
    if (!currentUser) {
        alert("Log in before saving files.");
        return;
    }

    localStorage.setItem("media_" + currentUser,
        JSON.stringify(media));

    localStorage.setItem("folders_" + currentUser,
        JSON.stringify(folders));
}

function loadData() {
    if (!currentUser) return;

    media = JSON.parse(
        localStorage.getItem("media_" + currentUser) || "[]"
    );

    folders = JSON.parse(
        localStorage.getItem("folders_" + currentUser) ||
        '["My Files"]'
    );
    render();
}

function makeCard(item) {
    let card = document.createElement("div");
    card.className = "card";

    let preview = document.createElement(
        item.type.startsWith("image/") ? "img" : "video"
    );

    preview.src = item.data;

    if (preview.tagName === "VIDEO") {
        preview.controls = true;
    }

    let title = document.createElement("p");
    title.textContent = item.name;

    let folder = document.createElement("small");
    folder.textContent = "Folder: " + item.folder;

    let rename = document.createElement("button");
    rename.textContent = "✏️ Rename";
    rename.onclick = () => renameMedia(item.id);

    let move = document.createElement("button");
    move.textContent = "📁 Move";
    move.onclick = () => moveMedia(item.id);

    let del = document.createElement("button");
    del.textContent = "🗑 Delete";
    del.onclick = () => deleteMedia(item.id);

    card.append(preview, title, folder, rename, move, del);
    return card;
}

function renderGallery(element, list) {
    element.innerHTML = "";
    list.forEach(item => {
        element.appendChild(makeCard(item));
    });
}

function render() {
    let current = media.filter(
        m => m.folder === selectedFolder
    );

    renderGallery(
        document.getElementById("mediaGallery"), current
    );

    renderGallery(
        document.getElementById("imageGallery"),
        media.filter(m => m.type.startsWith("image/"))
    );

    renderGallery(
        document.getElementById("videoGallery"),
        media.filter(m => m.type.startsWith("video/"))
    );

    let folderHTML = "";
    folders.forEach(name => {
        let button = document.createElement("button");
        button.className = "folder" +
            (name === selectedFolder ? " active" : "");
        button.textContent = "📁 " + name;
        button.onclick = () => selectFolder(name);

        document.getElementById("folderList")
            .appendChild(button.cloneNode(true));
        button.onclick = () => selectFolder(name);
    });

    let list = document.getElementById("folderList");
    list.innerHTML = "";
    folders.forEach(name => {
        let button = document.createElement("button");
        button.className = "folder" +
            (name === selectedFolder ? " active" : "");
        button.textContent = "📁 " + name;
        button.onclick = () => selectFolder(name);
        list.appendChild(button);
    });

    let pageList = document.getElementById("folderPageList");
    pageList.innerHTML = "";
    folders.forEach(name => {
        let button = document.createElement("button");
        button.textContent = "📁 " + name;
        button.onclick = () => selectFolder(name);
        pageList.appendChild(button);
    });
}

render();
</script>

</body>
</html>
